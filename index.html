<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>内蒙古自驾游 · 秋 2026</title>
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
<style>
  @font-face {
    font-family: "Marina Sans SC";
    src: url("./assets/fonts/noto-sans-sc-map-subset.woff2") format("woff2");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Marina Serif SC";
    src: url("./assets/fonts/noto-serif-sc-map-subset.woff2") format("woff2");
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }

  :root {
    /* 秋色 palette — 苔藓、燕麦、枫、暮云 */
    --ink:        #1a1f1a;    /* 深墨绿黑 */
    --ink-2:      #3a423a;
    --paper:      #f6f2ea;    /* 燕麦纸 */
    --paper-2:    #ede7dc;
    --moss:       #4a5d3a;    /* 苔藓绿（去程/自然）*/
    --maple:      #b8593b;    /* 枫红（环线/高潮）*/
    --amber:      #a8823a;    /* 琥珀（回程）*/
    --dust:       #8a8578;    /* 暮云灰 */
    --line:       rgba(26,31,26,0.12);
    --line-2:     rgba(26,31,26,0.06);

    --font-serif: "Marina Serif SC", ui-serif, "Iowan Old Style", "Songti SC", STSong, "Noto Serif CJK SC", Georgia, serif;
    --font-sans:  "Marina Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #map {
    position: absolute; top: 0; left: 0; right: 0; bottom: 320px;
    z-index: 1;
    background-color: #ebe6dc;
    background-image:
      radial-gradient(circle at 18% 24%, rgba(74,93,58,0.12) 0 2px, transparent 3px),
      radial-gradient(circle at 72% 68%, rgba(184,89,59,0.10) 0 2px, transparent 3px),
      linear-gradient(rgba(26,31,26,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,31,26,0.045) 1px, transparent 1px);
    background-size: 96px 96px, 128px 128px, 32px 32px, 32px 32px;
  }

  /* 顶栏 */
  .title-bar {
    position: absolute; top: 14px; left: 14px;
    background: rgba(246,242,234,0.94);
    padding: 10px 16px;
    border-radius: 2px;
    z-index: 500;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
  }
  .title-bar .brand {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink);
    line-height: 1;
  }
  .title-bar .brand em {
    font-style: italic;
    color: var(--maple);
    font-weight: 400;
  }
  .title-bar .sub {
    font-size: 10px;
    color: var(--dust);
    margin-top: 5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 400;
  }

  .map-status {
    position: absolute;
    top: 76px;
    left: 14px;
    z-index: 700;
    max-width: min(320px, calc(100vw - 28px));
    padding: 7px 10px;
    border: 1px solid rgba(168,130,58,0.28);
    border-radius: 2px;
    background: rgba(246,242,234,0.94);
    color: var(--ink-2);
    box-shadow: 0 4px 16px rgba(26,31,26,0.08);
    font-size: 11px;
    line-height: 1.4;
    letter-spacing: 0.02em;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    pointer-events: none;
  }
  .map-status[hidden] { display: none; }
  .leaflet-control-attribution {
    color: var(--ink-2);
    background: rgba(246,242,234,0.90) !important;
    font-family: var(--font-sans);
  }
  .leaflet-control-attribution a { color: var(--moss); }

  /* Marker */
  .day-marker {
    background: var(--paper);
    border-radius: 50%;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif);
    font-weight: 500; font-size: 12px;
    color: var(--ink-2);
    border: 1.5px solid var(--dust);
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .day-marker.active {
    transform: scale(1.5);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    z-index: 999;
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .day-marker.outbound { border-color: var(--moss); color: var(--moss); }
  .day-marker.loop     { border-color: var(--maple); color: var(--maple); }
  .day-marker.return   { border-color: var(--amber); color: var(--amber); }
  .day-marker.start {
    background: var(--ink); color: var(--paper);
    border-color: var(--ink);
    font-family: var(--font-sans);
    font-size: 10px;
    letter-spacing: 0.05em;
    width: 34px; height: 34px;
  }

  /* 底部 */
  #bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 320px; background: var(--paper); z-index: 1000;
    box-shadow: 0 -1px 0 var(--line), 0 -8px 32px rgba(26,31,26,0.06);
    display: flex; flex-direction: column;
  }

  /* Day 切换器 */
  #day-switcher {
    display: flex; overflow-x: auto; overflow-y: hidden;
    padding: 14px 16px 10px;
    gap: 4px;
    border-bottom: 1px solid var(--line-2);
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
  }
  #day-switcher::-webkit-scrollbar { display: none; }
  .day-chip {
    flex-shrink: 0;
    padding: 7px 14px;
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--dust);
    cursor: pointer;
    white-space: nowrap;
    border: none;
    background: transparent;
    letter-spacing: 0.02em;
    transition: all 0.2s;
    border-bottom: 1.5px solid transparent;
    position: relative;
    font-weight: 400;
  }
  .day-chip:hover { color: var(--ink); }
  .day-chip.active {
    color: var(--ink);
    font-weight: 500;
    border-bottom-color: var(--ink);
  }
  .day-chip .sub {
    display: block;
    font-family: var(--font-sans);
    font-size: 9px;
    color: var(--dust);
    margin-top: 1px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 400;
  }
  .day-chip.active .sub { color: var(--ink-2); }

  .day-chip.overview {
    font-style: italic;
    padding-right: 18px;
    margin-right: 4px;
    border-right: 1px solid var(--line);
  }

  /* 详情 */
  #detail {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px 26px;
    -webkit-overflow-scrolling: touch;
  }
  #detail h2 {
    margin: 0 0 4px 0;
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  #detail h2 .day-num {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 400;
    color: var(--dust);
    font-size: 20px;
    margin-right: 8px;
  }
  #detail .date-drive {
    color: var(--dust);
    font-size: 11px;
    margin-bottom: 18px;
    display: flex;
    gap: 14px;
    align-items: center;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 400;
  }
  #detail .date-drive .drive {
    color: var(--ink-2);
  }
  #detail .activity {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line-2);
  }
  #detail .activity:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 4px; }
  #detail .activity .name {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 6px;
    letter-spacing: -0.005em;
  }
  #detail .activity .why {
    font-size: 13px;
    line-height: 1.75;
    color: var(--ink-2);
    letter-spacing: 0.005em;
  }
  #detail .activity .map-link {
    display: inline-flex;
    align-items: center;
    margin-top: 8px;
    color: #4a5d3a;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.02em;
  }
  #detail .activity .map-link:hover { text-decoration: underline; }
  #detail .lodging {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    background: #f3f0e8;
    border: 1px solid #e4dfd3;
  }
  #detail .lodging .eyebrow { font-size: 11px; letter-spacing: .08em; color: #8a7b5b; text-transform: uppercase; }
  #detail .lodging .hotel-name { margin-top: 5px; font-size: 16px; font-weight: 650; color: #292821; }
  #detail .lodging .hotel-meta, #detail .lodging .hotel-address { margin-top: 5px; font-size: 12px; line-height: 1.55; color: #6d6a62; }
  #detail .lodging .hotel-actions { display: flex; gap: 8px; margin-top: 11px; }
  #detail .lodging button, #detail .lodging a {
    appearance: none; border: 1px solid #d4cdbd; border-radius: 9px; background: #fff;
    padding: 8px 10px; color: #4a5d3a; font: inherit; font-size: 12px; text-decoration: none; cursor: pointer;
  }

  /* 总览模式 */
  #detail.overview-mode h2 {
    font-size: 26px;
    font-style: italic;
    font-weight: 400;
    margin-bottom: 6px;
  }
  #detail.overview-mode .subtitle {
    color: var(--dust);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  #detail.overview-mode .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    padding: 18px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  #detail.overview-mode .stat .num {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  #detail.overview-mode .stat .num .unit {
    font-size: 13px;
    color: var(--dust);
    margin-left: 3px;
    letter-spacing: 0;
  }
  #detail.overview-mode .stat .label {
    font-size: 10px;
    color: var(--dust);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 6px;
  }
  #detail.overview-mode .cities-title {
    font-family: var(--font-serif);
    font-size: 13px;
    color: var(--dust);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #detail.overview-mode .cities {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-bottom: 20px;
  }
  #detail.overview-mode .city {
    font-family: var(--font-serif);
    font-size: 15px;
    color: var(--ink);
  }
  #detail.overview-mode .city .nights {
    color: var(--dust);
    font-size: 10px;
    margin-left: 2px;
    font-family: var(--font-sans);
    letter-spacing: 0.05em;
  }
  #detail.overview-mode .city + .city::before {
    content: '·';
    color: var(--dust);
    margin-right: 10px;
  }
  #detail.overview-mode .legend-row {
    display: flex;
    gap: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--line-2);
    font-size: 11px;
    color: var(--dust);
    letter-spacing: 0.05em;
  }
  #detail.overview-mode .legend-row .item {
    display: flex; align-items: center; gap: 5px;
  }
  #detail.overview-mode .legend-row .swatch {
    width: 16px; height: 2px;
  }

  @media (max-width: 480px) {
    #map { bottom: 320px; }
    #detail { padding: 18px 18px 22px; }
    #detail.overview-mode .stats { gap: 12px; }
    #detail.overview-mode .stat .num { font-size: 24px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="title-bar">
  <div class="brand">内蒙古自驾 · <em>秋 2026</em></div>
  <div class="sub">Sep 23 — Oct 5 · 13 days · Dalian ↺ Hulunbuir</div>
</div>
<div id="map-status" class="map-status" role="status" aria-live="polite" hidden></div>

<div id="bottom">
  <div id="day-switcher"></div>
  <div id="detail"></div>
</div>

<script src="./vendor/leaflet/leaflet.js"></script>
<script>
const COLORS = {
  outbound: '#4a5d3a',  // moss
  loop:     '#b8593b',  // maple
  return:   '#a8823a',  // amber
};

// 东北+内蒙区域 bounds — 也是"总览"视图
const REGION_BOUNDS = [[38.5, 117.0], [52.0, 126.0]];

const map = L.map('map', {
  zoomControl: false,
  attributionControl: false,
  minZoom: 5, maxZoom: 12,
}).fitBounds(REGION_BOUNDS);

L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.attribution({ position: 'bottomleft', prefix: false })
  .addAttribution('<a href="https://www.amap.com/" target="_blank" rel="noopener">底图 © 高德地图</a> · GCJ-02')
  .addTo(map);

const mapStatus = document.getElementById('map-status');
const tileState = { loaded: 0, failed: 0, timer: null };

function showMapStatus(message) {
  mapStatus.textContent = message;
  mapStatus.hidden = false;
}

function hideMapStatus() {
  mapStatus.hidden = true;
  mapStatus.textContent = '';
}

function beginTileLoad() {
  tileState.loaded = 0;
  tileState.failed = 0;
  clearTimeout(tileState.timer);
  tileState.timer = setTimeout(() => {
    if (tileState.loaded === 0) {
      showMapStatus('底图加载较慢 · 路线与行程仍可查看');
    }
  }, 4500);
}

// 高德公开道路瓦片使用 GCJ-02，与 routes.json 中的高德路线坐标一致；不需要或暴露 API key。
const baseTiles = L.tileLayer(
  'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {
    subdomains: ['1', '2', '3', '4'],
    minZoom: 3,
    maxZoom: 18,
    errorTileUrl: './assets/map-fallback-tile.svg',
  }
);

baseTiles.on('loading', beginTileLoad);
baseTiles.on('tileload', () => { tileState.loaded += 1; });
baseTiles.on('tileerror', () => {
  tileState.failed += 1;
  showMapStatus(tileState.loaded > 0
    ? '部分底图未加载 · 路线与行程仍可查看'
    : '底图暂不可用 · 路线与行程仍可查看');
});
baseTiles.on('load', () => {
  clearTimeout(tileState.timer);
  if (tileState.failed === 0 && tileState.loaded > 0) {
    hideMapStatus();
  } else if (tileState.loaded > 0) {
    showMapStatus('部分底图未加载 · 路线与行程仍可查看');
  } else {
    showMapStatus('底图暂不可用 · 路线与行程仍可查看');
  }
});
baseTiles.addTo(map);

const switcher = document.getElementById('day-switcher');
const detail = document.getElementById('detail');
let allSegments = [];
let allDays = [];
let markers = [];
let polylines = [];

const OVERVIEW = {
  totalKm: 4206,
  totalDays: 13,
  cities: [
    { name: '大连', nights: '起终点' },
    { name: '通辽', nights: '1晚' },
    { name: '阿尔山市区', nights: '1晚 ✅' },
    { name: '阿尔山森林公园', nights: '2晚 ✅' },
    { name: '满洲里', nights: '2晚' },
    { name: '额尔古纳', nights: '1晚' },
    { name: '莫尔道嘎', nights: '2晚' },
    { name: '海拉尔', nights: '1晚' },
    { name: '齐齐哈尔', nights: '1晚' },
    { name: '四平', nights: '1晚' },
  ],
};

function renderOverview() {
  // chips
  document.querySelectorAll('.day-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.day === 'overview');
  });
  // markers 全部还原
  markers.forEach(m => {
    const el = m.getElement()?.querySelector('.day-marker');
    if (el) el.classList.remove('active');
  });
  // polyline 全部高亮
  polylines.forEach(pl => pl.setStyle({ opacity: 0.85, weight: 3.5 }));
  // 地图缩到总览
  map.flyToBounds(REGION_BOUNDS, { duration: 0.8, padding: [20, 20] });

  detail.className = 'overview-mode';
  detail.innerHTML = `
    <h2>行程总览</h2>
    <div class="subtitle">Grand Route · 大兴安岭 & 呼伦贝尔</div>
    <div class="stats">
      <div class="stat">
        <div class="num">${OVERVIEW.totalDays}<span class="unit">天</span></div>
        <div class="label">Days</div>
      </div>
      <div class="stat">
        <div class="num">${OVERVIEW.totalKm.toLocaleString()}<span class="unit">km</span></div>
        <div class="label">Distance</div>
      </div>
      <div class="stat">
        <div class="num">${OVERVIEW.cities.length - 1}<span class="unit">城</span></div>
        <div class="label">Stops</div>
      </div>
    </div>
    <div class="cities-title">Overnight Cities</div>
    <div class="cities">
      ${OVERVIEW.cities.map(c => `<span class="city">${c.name}<span class="nights">·${c.nights}</span></span>`).join('')}
    </div>
    <div class="legend-row">
      <div class="item"><div class="swatch" style="background:#4a5d3a"></div>去程</div>
      <div class="item"><div class="swatch" style="background:#b8593b"></div>环线</div>
      <div class="item"><div class="swatch" style="background:#a8823a"></div>回程</div>
      <div class="item"><div class="swatch" style="background:#8a8578;height:0;border-top:2px dashed #8a8578"></div>边境估算</div>
    </div>
  `;
  detail.scrollTop = 0;
}

async function copyHotelAddress(button, address) {
  try {
    await navigator.clipboard.writeText(address);
    const old = button.textContent;
    button.textContent = '已复制';
    setTimeout(() => { button.textContent = old; }, 1200);
  } catch (_) {
    window.prompt('复制酒店地址', address);
  }
}

function renderDay(day) {
  document.querySelectorAll('.day-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.day === String(day.day));
  });
  markers.forEach((m, i) => {
    const el = m.getElement()?.querySelector('.day-marker');
    if (el) el.classList.toggle('active', allDays[i].day === day.day);
  });
  polylines.forEach((pl, i) => {
    const seg = allSegments[i];
    const segDayNum = parseInt(seg.day_label.replace('Day ', ''));
    if (segDayNum === day.day) {
      pl.setStyle({ opacity: 1, weight: 5 });
    } else {
      pl.setStyle({ opacity: 0.18, weight: 2.5 });
    }
  });

  detail.className = '';
  detail.innerHTML = `
    <h2><span class="day-num">Day ${day.day}</span>${day.title}</h2>
    <div class="date-drive">
      <span>${day.date}</span>
      <span class="drive">${day.drive}</span>
    </div>
    ${day.activities.map(a => `
      <div class="activity">
        <div class="name">${a.name}</div>
        <div class="why">${a.why}</div>
        ${a.mapUrl ? `<a class="map-link" href="${a.mapUrl}" target="_blank" rel="noopener">高德地图 ↗</a>` : ''}
      </div>
    `).join('')}
    ${day.lodging ? `
      <div class="lodging">
        <div class="eyebrow">Hotel · 已预订</div>
        <div class="hotel-name">${day.lodging.name}</div>
        <div class="hotel-meta">${day.lodging.dates} · ${day.lodging.room} · ${day.lodging.price}</div>
        <div class="hotel-address">${day.lodging.address}</div>
        ${day.lodging.note ? `<div class="hotel-address">⚠️ ${day.lodging.note}</div>` : ''}
        <div class="hotel-actions">
          <button type="button" onclick="copyHotelAddress(this, '${day.lodging.address}')">复制地址</button>
          <a href="${day.lodging.mapUrl}" target="_blank" rel="noopener">打开地图</a>
        </div>
      </div>
    ` : ''}
  `;
  detail.scrollTop = 0;
  map.flyTo([day.lat, day.lng], 7, { duration: 0.8 });
}

fetch('./routes.json')
  .then(r => {
    if (!r.ok) throw new Error(`routes.json HTTP ${r.status}`);
    return r.json();
  })
  .then(data => {
  allSegments = data.segments;
  allDays = data.days;

  data.segments.forEach(seg => {
    const color = COLORS[seg.phase] || '#666';
    const pts = seg.polyline.map(p => [p[0], p[1]]);
    const opts = { color: color, weight: 3.5, opacity: 0.85, lineCap: 'round', lineJoin: 'round' };
    if (seg.fallback) { opts.dashArray = '6, 8'; opts.opacity = 0.6; }
    polylines.push(L.polyline(pts, opts).addTo(map));
  });

  data.days.forEach(day => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="day-marker ${day.phase}">${day.day}</div>`,
      iconSize: [26, 26], iconAnchor: [13, 13]
    });
    const m = L.marker([day.lat, day.lng], { icon }).addTo(map);
    m.on('click', () => renderDay(day));
    markers.push(m);
  });

  // 大连起点
  const startIcon = L.divIcon({
    className: '',
    html: `<div class="day-marker start">DL</div>`,
    iconSize: [34, 34], iconAnchor: [17, 17]
  });
  L.marker([38.913962, 121.614786], { icon: startIcon }).addTo(map);

  // 总览 chip
  const overviewChip = document.createElement('button');
  overviewChip.className = 'day-chip overview active';
  overviewChip.dataset.day = 'overview';
  overviewChip.innerHTML = `总览<span class="sub">Overview</span>`;
  overviewChip.addEventListener('click', () => {
    renderOverview();
    overviewChip.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
  });
  switcher.appendChild(overviewChip);

  // 每天 chip
  data.days.forEach(day => {
    const chip = document.createElement('button');
    chip.className = 'day-chip';
    chip.dataset.day = String(day.day);
    const dateShort = day.date.split(' ')[0];
    chip.innerHTML = `Day ${day.day}<span class="sub">${dateShort}</span>`;
    chip.addEventListener('click', () => {
      renderDay(day);
      chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
    switcher.appendChild(chip);
  });

  // 默认打开总览
  renderOverview();
}).catch(error => {
  console.error('Failed to load routes.json', error);
  showMapStatus('路线数据加载失败 · 请稍后重试');
  detail.className = '';
  detail.innerHTML = `
    <h2>路线数据暂不可用</h2>
    <div class="date-drive">请刷新页面后重试</div>
  `;
});
</script>
</body>
</html>
